[package]
name = "pineforge"
version = "0.1.1"
edition = "2024"
# image 0.25.10 needs 1.88, edition 2024 alone would allow 1.85
rust-version = "1.88"
description = "Transform any image to fit the Rose Pine palette"
license = "GPL-3.0-or-later"
repository = "https://github.com/antste0/pineforge"
readme = "README.md"
keywords = ["rose-pine", "image", "palette", "dithering", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
# The README thumbnails still show on crates.io, it resolves relative links against the repository
exclude = ["examples", "thumbnails", ".github", ".gitignore"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# Wallpapers come as JPEG, PNG or WebP, the default formats more than double the build time (mostly the AVIF encoder)
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rayon = "1.12.0"

[profile.release]
strip = true
